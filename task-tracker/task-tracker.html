<!DOCTYPE html>
<html lang="id">
<head><link rel="icon" type="image/x-icon" href="../logo-richard-icon.png"> 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker — SG Richard Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0b0e14;
      --bg2:       #12161f;
      --bg3:       #171d2b;
      --border:    rgba(255,255,255,0.09);
      --border2:   rgba(255,255,255,0.13);
      --text:      #e8eaf0;
      --text-rgb:  232,234,240;
      --muted:     #808a9e;
      --accent:    #6c63ff; --accent-rgb: 108,99,255;
      --accent2:   #a78bfa; --accent2-rgb: 167,139,250;
      --success:   #2fd0a3; --success-rgb: 47,208,163;
      --danger:    #f87171; --danger-rgb: 248,113,113;
      --gold:      #f7b733; --gold-rgb: 247,183,51;
      --skip:      #4b5563; --skip-rgb: 75,85,99;
      --card:      #12161f;
      --shadow:    rgba(0,0,0,0.45);
      --radius-lg: 28px;
      --radius-md: 18px;
    }

    /* Mode terang — warna disamakan dengan mode terang Directory/Dashboard */
    [data-theme="light"] {
      --bg:        #fdf8ea;
      --bg2:       #ffffff;
      --bg3:       #fbf0c8;
      --border:    #e6d9a3;
      --border2:   rgba(57,56,64,0.16);
      --text:      #393840;
      --text-rgb:  57,56,64;
      --muted:     #6b6a72;
      --accent:    #e8730e; --accent-rgb: 232,115,14;
      --accent2:   #f2954a; --accent2-rgb: 242,149,74;
      --success:   #2f8f6e; --success-rgb: 47,143,110;
      --danger:    #c0392b; --danger-rgb: 192,57,43;
      --gold:      #b8860f; --gold-rgb: 184,134,15;
      --skip:      #9c9686; --skip-rgb: 156,150,134;
      --card:      #ffffff;
      --shadow:    rgba(57,56,64,0.16);
    }

    html { scroll-behavior: smooth; }

    body {
      background:
        radial-gradient(ellipse 700px 400px at 15% 0%, rgba(var(--accent-rgb),0.16), transparent 60%),
        radial-gradient(ellipse 600px 400px at 90% 100%, rgba(var(--gold-rgb),0.10), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.2s, color 0.2s;
    }

    h1, h2, h3, .display { font-family: 'Syne', sans-serif; }

    /* ── GRID BACKGROUND ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(var(--accent-rgb),0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(var(--accent-rgb),0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── decorative background blobs (match Dashboard) ── */
    .blob {
      position: fixed;
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
    }
    .blob-teal { width: 260px; height: 260px; background: var(--success); opacity: .18; left: -90px; bottom: -90px; filter: blur(60px); }
    .blob-orange { width: 190px; height: 190px; background: var(--gold); opacity: .16; left: 40px; bottom: -110px; filter: blur(60px); }

    /* ── PORTAL LAYOUT (sidebar + main, same as Dashboard) ── */
    .portal-shell {
      position: relative;
      z-index: 1;
      max-width: 1180px;
      margin: 40px auto;
      padding: 40px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 30px 60px -30px var(--shadow);
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 44px;
      overflow: hidden;
    }
    .portal-shell::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--gold), transparent);
    }

    /* Sidebar */
    .sidebar { display: flex; flex-direction: column; align-items: flex-start; }
    .logo-mark {
      width: 52px; height: 52px; border-radius: 14px;
      background: var(--bg3);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 30px;
      padding: 6px;
    }
    .logo-mark img { width: 100%; height: 100%; object-fit: contain; }

    .avatar-side {
      width: 100px; height: 100px; border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif;
      font-size: 30px; font-weight: 700;
      position: relative;
      margin-bottom: 14px;
    }
    .batch-badge {
      position: absolute;
      bottom: -10px;
      background: var(--gold);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .student-name { font-size: 18px; font-weight: 600; margin: 18px 0 2px; }
    .student-id { font-size: 13px; color: var(--muted); margin-bottom: 32px; }

    nav { display: flex; flex-direction: column; gap: 6px; width: 100%; }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      width: 100%;
      padding: 9px 10px;
      border-radius: 14px;
      font-size: 14.5px; font-weight: 500; color: var(--muted);
      text-decoration: none;
      cursor: default;
      transition: background .15s, color .15s;
    }
    .nav-icon {
      width: 32px; height: 32px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background .15s, color .15s;
    }
    .nav-icon svg { width: 16px; height: 16px; stroke: currentColor; }
    .nav-icon-purple { background: rgba(var(--accent-rgb),0.15); color: var(--accent); }
    .nav-icon-teal { background: rgba(var(--success-rgb),0.15); color: var(--success); }
    .nav-icon-orange { background: rgba(var(--gold-rgb),0.15); color: var(--gold); }
    .nav-icon-gold { background: rgba(var(--gold-rgb),0.15); color: var(--gold); }

    .nav-item.active { background: var(--bg3); color: var(--text); font-weight: 700; }
    .nav-item.active .nav-icon-purple { background: var(--accent); color: #fff; }
    .nav-item.active .nav-icon-teal { background: var(--success); color: #fff; }
    .nav-item.active .nav-icon-orange { background: var(--gold); color: #fff; }
    .nav-item.active .nav-icon-gold { background: var(--gold); color: #fff; }

    .nav-item.link { cursor: pointer; }
    .nav-item.link:hover { background: var(--bg3); color: var(--text); }

    .nav-item.disabled { opacity: .6; }
    .soon-tag {
      margin-left: auto;
      font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
      background: var(--bg3); color: var(--muted);
      padding: 3px 8px; border-radius: 999px;
      white-space: nowrap;
    }

    /* Main content */
    main { min-width: 0; }
    .top-row {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 8px;
    }
    .greeting h1 {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .greeting .subtitle { color: var(--muted); font-size: 14px; margin-top: 8px; }

    .top-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px 6px 6px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      transition: all 0.15s;
    }
    .theme-toggle:hover { border-color: var(--accent); color: var(--text); }
    .theme-toggle-icon {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--bg2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    .logout-btn {
      display: flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .06em;
      cursor: pointer;
      text-transform: uppercase;
      transition: opacity 0.15s;
      flex-shrink: 0;
    }
    .logout-btn:hover { opacity: 0.9; }

    .content-wrap {
      position: relative;
      z-index: 1;
      max-width: 640px;
      padding-bottom: 20px;
    }

    .admin-search-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(247, 183, 51, 0.1);
      border: 1px solid rgba(247, 183, 51, 0.35);
    }
    .admin-search-icon { flex-shrink: 0; }
    .admin-search-row input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: 1px solid rgba(247, 183, 51, 0.4);
      border-radius: 8px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 13.5px;
      color: inherit;
      outline: none;
    }
    .admin-search-row button {
      flex-shrink: 0;
      border: 1px solid rgba(247, 183, 51, 0.45);
      background: rgba(247, 183, 51, 0.15);
      color: inherit;
      border-radius: 8px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .admin-search-row button:hover { background: rgba(247, 183, 51, 0.28); }
    .admin-search-hint {
      font-size: 12px;
      margin: -8px 0 16px 2px;
      opacity: 0.75;
    }

    /* ── STATES ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state .icon-wrap {
      width: 64px; height: 64px;
      border-radius: 18px;
      background: var(--bg3);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .empty-state svg { width: 28px; height: 28px; stroke: var(--muted); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .empty-state p { font-size: 14px; line-height: 1.6; max-width: 280px; margin: 0 auto; }
    .empty-state .title { font-size: 16px; font-weight: 500; color: var(--text); margin-bottom: 8px; }

    .error-box {
      background: rgba(var(--danger-rgb),0.08);
      border: 1px solid rgba(var(--danger-rgb),0.25);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--danger);
    }

    .error-box svg { width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

    .loading-box {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
      font-size: 14px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { display: inline-block; width: 22px; height: 22px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }

    /* ── RESULT CARD ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-wrap { animation: fadeUp 0.35s ease both; }

    .profile-card {
      background: var(--card);
      border: 1px solid var(--border2);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }

    .profile-card::after {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(var(--accent-rgb),0.08), transparent 70%);
      pointer-events: none;
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 20px;
    }

    .avatar {
      width: 60px; height: 60px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
      letter-spacing: -0.02em;
    }

    .profile-info .name {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .tag-id    { background: rgba(var(--text-rgb),0.06); color: var(--muted); border: 1px solid var(--border); }
    .tag-pkg   { background: rgba(var(--accent-rgb),0.12); color: var(--accent2); border: 1px solid rgba(var(--accent-rgb),0.25); }
    .tag-sa    { background: rgba(var(--success-rgb),0.08); color: var(--success); border: 1px solid rgba(var(--success-rgb),0.2); }
    .tag-hl    { background: rgba(var(--gold-rgb),0.14); color: var(--gold); border: 1px solid rgba(var(--gold-rgb),0.3); }

    .tag svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ── STATS ROW ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
    }

    .stat-card .stat-num {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-card .stat-lbl {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .stat-green .stat-num { color: var(--success); }
    .stat-red .stat-num   { color: var(--danger); }
    .stat-gray .stat-num  { color: var(--skip); }
    .stat-blue .stat-num  { color: var(--accent2); }

    /* ── TASK LIST ── */
    .section-heading {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 10px;
    }

    .task-list { display: flex; flex-direction: column; gap: 8px; }

    .task-row {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: border-color 0.2s;
    }

    .task-row:hover { border-color: var(--border2); }

    .task-left { flex: 1; min-width: 0; }

    .task-eyebrow {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.05em;
      margin-bottom: 3px;
    }

    .task-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .task-badge svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

    .badge-done   { background: rgba(var(--success-rgb),0.1); color: var(--success); border: 1px solid rgba(var(--success-rgb),0.2); }
    .badge-miss   { background: rgba(var(--danger-rgb),0.1);  color: var(--danger);  border: 1px solid rgba(var(--danger-rgb),0.2); }
    .badge-skip   { background: rgba(var(--skip-rgb),0.2);    color: var(--skip);    border: 1px solid rgba(var(--skip-rgb),0.3); }

    /* ── PROGRESS BAR ── */
    .progress-wrap {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .progress-label { font-size: 12px; color: var(--muted); }
    .progress-pct { font-size: 13px; font-weight: 600; color: var(--accent2); }

    .progress-bar-bg {
      height: 6px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--success));
      border-radius: 999px;
      transition: width 0.6s cubic-bezier(0.34,1.56,0.64,1);
    }

    /* ── FOOTER ── */
    footer {
      margin-top: 60px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      padding-bottom: 20px;
    }

    footer a { color: var(--accent2); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* ── RESPONSIVE ── */
    @media (max-width: 780px) {
      .portal-shell { grid-template-columns: 1fr; padding: 24px 20px 28px; margin: 12px; gap: 26px; border-radius: 22px; }
      .sidebar { align-items: center; text-align: center; }
      .logo-mark { width: 44px; height: 44px; margin-bottom: 16px; }
      .avatar-side { width: 76px; height: 76px; font-size: 22px; margin-bottom: 18px; }
      .batch-badge { font-size: 11px; padding: 4px 12px; }
      .student-name { font-size: 17px; margin: 0 0 2px; }
      .student-id { margin-bottom: 22px; }
      nav { gap: 4px; }
      .nav-item { padding: 12px; text-align: left; }
      .soon-tag { margin-left: 8px; }
      .top-row { align-items: flex-start; gap: 12px; }
      .greeting h1 { font-size: 26px; }
      .logout-btn { flex-shrink: 0; padding: 9px 14px; font-size: 11px; }
      .top-actions { gap: 8px; }
      .theme-toggle { padding: 6px 8px 6px 6px; }
      .theme-toggle-label { display: none; }
    }

    @media (max-width: 500px) {
      .stats-row { grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .stat-card { padding: 12px 8px; }
      .stat-card .stat-num { font-size: 22px; }
      .profile-top { gap: 12px; }
      .profile-card { padding: 20px; }
    }
  </style>
</head>
<body>

<div class="blob blob-teal"></div>
<div class="blob blob-orange"></div>

<div class="portal-shell">
  <aside class="sidebar">
    <div class="logo-mark"><img src="../images/logo-icon.png" alt="Richard J Winarta logo" /></div>
    <div class="avatar-side" id="avatarInitials">
      --
      <span class="batch-badge" id="batchBadge">Batch —</span>
    </div>
    <div class="student-name" id="studentName">Memuat...</div>
    <div class="student-id" id="studentIdLabel">—</div>

    <nav>
      <a class="nav-item link" href="../dashboard/index.html">
        <span class="nav-icon nav-icon-purple">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
        </span>
        Dashboard
      </a>
      <a class="nav-item link" href="../directory/directory.html">
        <span class="nav-icon nav-icon-teal">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </span>
        Directory
      </a>
      <span class="nav-item active">
        <span class="nav-icon nav-icon-orange">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="6" height="6" rx="1"/><path d="M3 17l2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>
        </span>
        Task Tracker
      </span>

// ============ THEME TOGGLE (dark = default) ============
function applyTheme(theme) {
  if (theme === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    document.getElementById('themeToggleIcon').textContent = '🌙';
    document.getElementById('themeToggleLabel').textContent = 'Mode Gelap';
  } else {
    document.documentElement.removeAttribute('data-theme');
    document.getElementById('themeToggleIcon').textContent = '☀️';
    document.getElementById('themeToggleLabel').textContent = 'Mode Cerah';
  }
}

const THEME_KEY = 'sgr-theme'; // key bersama, dipakai oleh semua halaman (dashboard/directory/tracker)

function toggleTheme() {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  const next = isLight ? 'dark' : 'light';
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* storage unavailable, theme still applies for this session */ }
}

function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (e) { /* storage unavailable, default to dark */ }
  applyTheme(saved === 'light' ? 'light' : 'dark');
}

window.addEventListener('storage', (e) => {
  if (e.key === THEME_KEY) {
    applyTheme(e.newValue === 'light' ? 'light' : 'dark');
  }
});

const CACHE_TTL_MS = 5 * 60 * 1000; // 5 menit — samakan dengan Dashboard, gampang diubah kalau perlu
const CACHE_PREFIX = "sgr_cache_";


const HOF_AVAILABLE_BATCHES = ["34"];

function getCache(key) {
  try {
    const raw = sessionStorage.getItem(CACHE_PREFIX + key);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (Date.now() - parsed.ts > CACHE_TTL_MS) return null; // sudah kadaluarsa
    return parsed.data;
  } catch (e) {
    return null; // sessionStorage error/disabled -> anggap tidak ada cache
  }
}

function setCache(key, data) {
  try {
    sessionStorage.setItem(CACHE_PREFIX + key, JSON.stringify({ ts: Date.now(), data }));
  } catch (e) {
    // storage penuh/diblok -> abaikan, tidak fatal
  }
}

// 
let cacheStore = {};
let taskDefs = null;

// ── buildTaskDefs ──
function buildTaskDefs(headers) {
  const defs = [];

  headers.forEach((h, idx) => {
    if (!h.toLowerCase().includes("score") || NON_TASK_COLS.includes(h)) return;

    const prefixMatch = h.match(/^(\d+)([A-Za-z]?)\.\s*/);
    const originalNo  = prefixMatch ? `${prefixMatch[1]}${prefixMatch[2] || ""}` : null;
    const bodyAfterPrefix = prefixMatch ? h.slice(prefixMatch[0].length) : h;

    const lessonMatch      = bodyAfterPrefix.match(/lesson\s*(\d+)/i);
    const moduleMatch      = bodyAfterPrefix.match(/^(EM|LG|SMM)\s+Module\s*(\d+)/i);
    const taskModMatch     = bodyAfterPrefix.match(/^Task\s*\d+\s+(ECM|MCR)\s*:/i);
    const feedbackModMatch = bodyAfterPrefix.match(/^(EM|LG|SMM)\s+Feedback/i);
    const labelMatch       = h.match(/:\s*(.+?)\s*Score\s*$/i);

    const maxHeaderRaw = headers[idx + 2] || "";
    const maxMatch      = maxHeaderRaw.match(/\d+(\.\d+)?/);
    const maxScore      = maxMatch ? maxMatch[0] : null;

    // 
    let service = null;
    for (const { keyword, service: svc } of SERVICE_KEYWORDS) {
      if (keyword.test(h)) { service = svc; break; }
    }

    let lessonLabel;
    if (lessonMatch) {
      lessonLabel = `Lesson ${lessonMatch[1]}`;
    } else if (moduleMatch) {
      lessonLabel = `${moduleMatch[1].toUpperCase()} Module ${moduleMatch[2]}`;
    } else if (taskModMatch) {
      lessonLabel = taskModMatch[1].toUpperCase();
    } else if (feedbackModMatch) {
      lessonLabel = `${feedbackModMatch[1].toUpperCase()} Feedback`;
    } else if (/feedback/i.test(bodyAfterPrefix)) {
      lessonLabel = "Feedback";
    } else {
      lessonLabel = "Lainnya";
    }

    defs.push({
      scoreKey: h,
      maxScore: maxScore,
      label:    labelMatch ? labelMatch[1].trim()
                            : h.replace(/Score\s*$/i, "").replace(/^\d+[A-Za-z]?\.\s*/, "").trim(),
      lesson:   lessonLabel,

      num:      originalNo ? `#${originalNo}` : "",
      service:  service,
    });
  });

  return defs;
}

// ──  ──
function parseRows(txt) {
  const allLines = txt.split("\n").filter(l => l.trim() !== "");

  const headerIndex = allLines.findIndex(l =>
    l.split(",").some(c => c.trim().replace(/^"|"$/g, "") === "StudentID")
  );

  if (headerIndex === -1) return { rows: [], headers: [] };

  const headers = allLines[headerIndex].split(",").map(h => h.trim().replace(/^"|"$/g, ""));

  const rows = allLines.slice(headerIndex + 1).map(line => {
    const cols = []; let cur = "", inQ = false;
    for (const ch of line) {
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur); cur = ""; }
      else cur += ch;
    }
    cols.push(cur);
    const o = {};
    headers.forEach((h, i) => o[h] = (cols[i] || "").replace(/^"|"$/g, "").trim());
    return o;
  }).filter(row => row["StudentID"] && row["StudentID"].trim() !== "");

  return { rows, headers };
}

async function getDataForBatch(batchKey) {
  if (cacheStore[batchKey]) return cacheStore[batchKey];

  const cached = getCache("task_tracker_rows_" + batchKey);
  if (cached) {
    cacheStore[batchKey] = { rows: cached.rows, taskDefs: cached.taskDefs };
    return cacheStore[batchKey];
  }

  const sourceUrl = resolveBatchSource(batchKey);
  if (!sourceUrl) return null;

  const r = await fetch(sourceUrl);
  if (!r.ok) throw new Error("Gagal mengambil data Batch " + batchKey + ".");
  const { rows, headers } = parseRows(await r.text());
  const defs = buildTaskDefs(headers);

  cacheStore[batchKey] = { rows, taskDefs: defs };
  setCache("task_tracker_rows_" + batchKey, { rows, taskDefs: defs });
  return cacheStore[batchKey];
}

function configuredBatchKeys() {
  return Object.keys(OOG_DEJSI).filter(function (k) {
    const decoded = resolveBatchSource(k);
    return typeof decoded === "string" && decoded.indexOf("http") === 0;
  });
}

async function getData() {
  const batchKey = normalizeBatch(currentSession && currentSession.batch);
  const result = await getDataForBatch(batchKey);
  if (!result) {
    throw new Error(`Sheet untuk Batch ${batchKey || "-"} belum terdaftar. Hubungi admin untuk menambahkan.`);
  }
  taskDefs = result.taskDefs;
  return result.rows;
}

async function searchAcrossBatches(needle, opts) {
  opts = opts || {};
  const needleLower = needle.toLowerCase();
  const ownBatch = normalizeBatch(currentSession && currentSession.batch);

  const batches = configuredBatchKeys().sort(function (a, b) {
    if (a === ownBatch) return -1;
    if (b === ownBatch) return 1;
    return 0;
  });

  for (const batchKey of batches) {
    let result;
    try {
      result = await getDataForBatch(batchKey);
    } catch (e) {
      continue;
    }
    if (!result) continue;

    let matches = result.rows.filter(r => String(r["StudentID"]).trim() === needle);
    if (matches.length === 0 && opts.allowNameSearch) {
      matches = result.rows.filter(r => (r["Students Name"] || "").toLowerCase().includes(needleLower));
    }
    if (matches.length > 0) {
      taskDefs = result.taskDefs;
      return { matches, batchKey };
    }
  }
  return { matches: [], batchKey: null };
}

let currentSession = null; // dipakai admin search buat balik ke data sendiri

async function showStudentTracker(studentIdOrName, opts) {
  opts = opts || {};
  const el = document.getElementById("result");
  el.innerHTML = `<div class="loading-box"><div class="spinner"></div><br>Memuat data...</div>`;

  try {
    const needle = String(studentIdOrName).trim();
    let matches, matchedBatch;

    if (opts.crossBatch) {
      const result = await searchAcrossBatches(needle, opts);
      matches = result.matches;
      matchedBatch = result.batchKey;
    } else {
      const data = await getData();
      const needleLower = needle.toLowerCase();
      matches = data.filter(r => String(r["StudentID"]).trim() === needle);
      if (matches.length === 0 && opts.allowNameSearch) {
        matches = data.filter(r => (r["Students Name"] || "").toLowerCase().includes(needleLower));
      }
      matchedBatch = normalizeBatch(currentSession && currentSession.batch);
    }

    if (matches.length === 0) {
      el.innerHTML = `<div class="empty-state">
        <div class="icon-wrap">${icon("user")}</div>
        <p class="title">Data tidak ditemukan</p>
        <p>"<strong>${escHtml(needle)}</strong>" tidak ditemukan${opts.crossBatch ? " di semua Batch yang terdaftar" : " di data Task Tracker"}.${opts.allowNameSearch ? " Coba Student ID atau nama lain." : "<br>Silahkan hubungi admin."}</p>
      </div>`;
      return;
    }

    if (matches.length > 1) {
      const hint = document.getElementById("adminSearchHint");
      if (hint) {
        hint.style.display = "block";
        hint.textContent = `Ditemukan ${matches.length} hasil${opts.crossBatch ? " di Batch " + matchedBatch : ""} untuk "${needle}", menampilkan yang pertama: ${matches[0]["Students Name"] || matches[0]["StudentID"]}.`;
      }
    } else {
      const hint = document.getElementById("adminSearchHint");
      if (hint) hint.style.display = "none";
    }

    const label = document.getElementById("studentIdLabel");
    if (label && matches[0]["StudentID"]) label.textContent = matches[0]["StudentID"];

    const badge = document.getElementById("batchBadge");
    if (badge && matchedBatch) badge.textContent = "Batch " + matchedBatch;

    renderResult(matches[0], el);
  } catch (e) {
    showError(el, e.message || "Terjadi kesalahan koneksi. Coba refresh halaman ini.");
  }
}


function setupAdminSearch(session) {

    const q = input.value.trim();
    if (!q) return;
    showStudentTracker(q, { allowNameSearch: true, crossBatch: true });

  input.addEventListener("keydown", function (e) {

          <div class="stat-lbl">Belum</div>
        </div>
        <div class="stat-card stat-blue">
          <div class="stat-num">${totalScore.toLocaleString("id-ID")}</div>
          <div class="stat-lbl">Total Score</div>
        </div>
        <!-- <div class="stat-card stat-gray">
          <div class="stat-num">${skip}</div>
          <div class="stat-lbl">N/A</div>
        </div> -->
      </div>

      <p class="section-heading">Progress tugas</p>
      <div class="task-list">${taskHTML}</div>

      <div class="progress-wrap">
        <div class="progress-header">
          <span class="progress-label">Completion rate</span>
          <span class="progress-pct">${pct}%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="pbar" style="width:0%"></div>
        </div>
      </div>
    </div>
  </div>`;

  setTimeout(() => {
    const bar = document.getElementById("pbar");
    if (bar) bar.style.width = pct + "%";
  }, 80);
}

init();
</script>
