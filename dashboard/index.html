<!DOCTYPE html>
<html lang="id">
<head><link rel="icon" type="image/x-icon" href="../logo-richard-icon.png"> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — SG Richard Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --cream: #0b0e14;
    --panel: #12161f;
    --surface-alt: #171d2b;
    --ink: #e8eaf0;
    --ink-soft: #808a9e;
    --purple: #6c63ff; --purple-rgb: 108,99,255;
    --purple-deep: #4c46c9;
    --purple-glow: #a78bfa;
    --teal: #2fd0a3; --teal-rgb: 47,208,163;
    --teal-deep: #1ea883;
    --teal-glow: #6fe3c0;
    --orange: #f7b733; --orange-rgb: 247,183,51;
    --orange-deep: #d69a1f;
    --orange-glow: #ffcf6e;
    --line: rgba(255,255,255,0.09);
    --purple-tint: rgba(var(--purple-rgb),0.15);
    --teal-tint: rgba(var(--teal-rgb),0.15);
    --orange-tint: rgba(var(--orange-rgb),0.15);
    --gold: #f7b733;
    --gold-tint: rgba(var(--orange-rgb),0.15);
    --error: #f87171; --error-rgb: 248,113,113;
    --error-tint: rgba(var(--error-rgb),0.14);
    --shadow: rgba(0,0,0,0.45);
    --radius-lg: 28px;
    --radius-md: 18px;
  }

  [data-theme="light"] {
    --cream: #fdf8ea;
    --panel: #ffffff;
    --surface-alt: #fbf0c8;
    --ink: #393840;
    --ink-soft: #6b6a72;
    --purple: #6c63ff; --purple-rgb: 108,99,255;
    --purple-deep: #4c46c9;
    --purple-glow: #a78bfa;
    --teal: #2f8f6e; --teal-rgb: 47,143,110;
    --teal-deep: #1f6e54;
    --teal-glow: #6fcf9f;
    --orange: #b8860f; --orange-rgb: 184,134,15;
    --orange-deep: #8f6b0c;
    --orange-glow: #d9a41f;
    --line: #e6d9a3;
    --purple-tint: rgba(var(--purple-rgb),0.15);
    --teal-tint: rgba(var(--teal-rgb),0.15);
    --orange-tint: rgba(var(--orange-rgb),0.15);
    --gold: #b8860f;
    --gold-tint: rgba(var(--orange-rgb),0.15);
    --error: #c0392b; --error-rgb: 192,57,43;
    --error-tint: rgba(var(--error-rgb),0.14);
    --shadow: rgba(57,56,64,0.16);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'DM Sans', sans-serif;
    background:
      radial-gradient(ellipse 700px 400px at 15% 0%, rgba(var(--purple-rgb),0.16), transparent 60%),
      radial-gradient(ellipse 600px 400px at 90% 100%, rgba(var(--orange-rgb),0.10), transparent 55%),
      var(--cream);
    color: var(--ink);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    transition: background 0.2s, color 0.2s;
  }

  h1, h2, h3, .display {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
  }

  .blob {
    position: fixed;
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
  }
  .blob-teal { width: 260px; height: 260px; background: var(--teal); opacity: .55; left: -90px; bottom: -90px; }
  .blob-orange { width: 190px; height: 190px; background: var(--orange); opacity: .5; left: 40px; bottom: -110px; }

  .shell {
    position: relative;
    z-index: 1;
    max-width: 1440px;
    width: 92%;
    margin: 40px auto;
    padding: 40px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: 0 30px 60px -30px var(--shadow);
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr) 320px;
    gap: 36px;
    overflow: hidden;
  }
  .shell::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--purple), var(--gold), transparent);
  }

  .sidebar { display: flex; flex-direction: column; align-items: flex-start; }
  .logo-mark {
    width: 52px; height: 52px; border-radius: 14px;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 30px;
    padding: 6px;
  }
  .logo-mark img { width: 100%; height: 100%; object-fit: contain; }

  .avatar {
    width: 100px; height: 100px; border-radius: 50%;
    background: var(--purple);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif;
    font-size: 30px; font-weight: 700;
    position: relative;
    margin-bottom: 14px;
  }
  .batch-badge {
    position: absolute;
    bottom: -10px;
    background: var(--orange);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 14px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .student-name { font-size: 18px; font-weight: 600; margin: 18px 0 2px; }
  .student-id { font-size: 13px; color: var(--ink-soft); margin-bottom: 32px; }

  nav { display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    width: 100%;
    padding: 9px 10px;
    border-radius: 14px;
    font-size: 14.5px; font-weight: 500; color: var(--ink-soft);
    text-decoration: none;
    cursor: default;
    transition: background .15s, color .15s;
  }
  .nav-icon {
    width: 32px; height: 32px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background .15s, color .15s;
  }
  .nav-icon svg { width: 16px; height: 16px; stroke: currentColor; }
  .nav-icon-purple { background: var(--purple-tint); color: var(--purple-deep); }
  .nav-icon-teal { background: var(--teal-tint); color: var(--teal-deep); }
  .nav-icon-orange { background: var(--orange-tint); color: var(--orange-deep); }
  .nav-icon-gold { background: var(--gold-tint); color: var(--gold); }

  .nav-item.active { background: var(--surface-alt); color: var(--ink); font-weight: 700; }
  .nav-item.active .nav-icon-purple { background: var(--purple-deep); color: #fff; }
  .nav-item.active .nav-icon-teal { background: var(--teal-deep); color: #fff; }
  .nav-item.active .nav-icon-orange { background: var(--orange-deep); color: #fff; }
  .nav-item.active .nav-icon-gold { background: var(--gold); color: #fff; }

  .nav-item.link { cursor: pointer; }
  .nav-item.link:hover { background: var(--surface-alt); color: var(--ink); }

  .nav-item.disabled { opacity: .6; }
  .soon-tag {
    margin-left: auto;
    font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    background: var(--surface-alt); color: var(--ink-soft);
    padding: 3px 8px; border-radius: 999px;
    white-space: nowrap;
  }

  .logout-mini {
    margin-top: auto;
    padding-top: 30px;
    font-size: 13px;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
  }

  main { min-width: 0; }
  .top-row {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 30px;
  }
  .greeting h1 { font-size: 32px; margin: 0; font-weight: 700; }
  .greeting .sub { color: var(--ink-soft); font-size: 14px; margin-top: 6px; }

  .top-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  .theme-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px 6px 6px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    transition: all 0.15s;
  }
  .theme-toggle:hover { border-color: var(--purple); color: var(--ink); }
  .theme-toggle-icon {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
  }

  .logout-btn {
    display: flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, var(--purple), var(--purple-glow));
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .06em;
    cursor: pointer;
    text-transform: uppercase;
    transition: opacity 0.15s;
  }
  .logout-btn:hover { opacity: 0.9; }

  .cards-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 34px;
  }
  .card {
    position: relative;
    border-radius: var(--radius-md);
    padding: 22px;
    color: #fff;
    min-height: 176px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
    isolation: isolate;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: -1;
    opacity: .5;
    background-image: radial-gradient(circle, rgba(255,255,255,.16) 1.5px, transparent 1.5px);
    background-size: 14px 14px;
  }
  .card::after {
    content: '';
    position: absolute;
    width: 150px; height: 150px;
    border-radius: 50%;
    right: -50px; top: -60px;
    background: rgba(255,255,255,.10);
    z-index: -1;
  }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card h3 { font-size: 20px; margin: 0; font-weight: 600; }
  .card-icon {
    width: 34px; height: 34px; border-radius: 10px;
    background: rgba(255,255,255,.18);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .card-icon svg { width: 18px; height: 18px; }

  .card-body { display: flex; align-items: center; gap: 16px; margin-top: 10px; }
  .ring-wrap { position: relative; width: 64px; height: 64px; flex-shrink: 0; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-track { fill: none; stroke: rgba(255,255,255,.28); stroke-width: 6; }
  .ring-fill { fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
  .ring-label {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px;
  }
  .card-stat-text .count { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 700; line-height: 1; }
  .card-stat-text .label { font-size: 12px; opacity: .88; margin-top: 4px; }

  .card-selesai { background: linear-gradient(155deg, var(--purple), var(--purple-deep)); }
  .card-belum { background: linear-gradient(155deg, var(--teal-glow), var(--teal-deep)); }
  .card-hids { background: linear-gradient(155deg, var(--orange-glow), var(--orange-deep)); }
  .card-hids .card-body { align-items: flex-start; flex-direction: column; gap: 8px; margin-top: 16px; }
  .card-hids .hids-value { font-family: 'Syne', sans-serif; font-size: 21px; font-weight: 700; }
  .card-hids .hids-tag {
    font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    background: rgba(255,255,255,.2); padding: 4px 10px; border-radius: 999px;
  }

  .section-title { font-size: 20px; font-weight: 700; margin: 0 0 16px; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  .stat-box {
    background: var(--surface-alt);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 20px;
  }
  .stat-box .big { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .stat-box .label { font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; }

  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
  }
  .status-approved { background: var(--teal-tint); color: var(--teal); }
  .status-pending { background: var(--orange-tint); color: var(--orange); }
  .status-rejected { background: var(--error-tint); color: var(--error); }

  .congrat-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 16px;
  }
  .congrat-pills-wrap { display: flex; flex-wrap: wrap; gap: 10px; }
  .congrat-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 700;
    background: var(--teal-tint);
    color: var(--teal);
    border: 1px solid rgba(var(--teal-rgb),0.35);
    animation: pillIn .35s cubic-bezier(.34,1.56,.64,1);
  }
  .congrat-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  @keyframes pillIn { from { opacity: 0; transform: translateY(6px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

.discord-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 20px 9px 18px;
  border-radius: 999px;
  background: #0d0d14;
  border: 1px solid rgba(88,101,242,0.9);
  box-shadow: 0 0 6px rgba(88,101,242,0.9), 0 0 18px rgba(88,101,242,0.6), inset 0 0 10px rgba(88,101,242,0.15);
  text-decoration: none;
  flex-shrink: 0;
  transition: transform .15s ease, opacity .15s ease;
}
.discord-btn:hover { transform: scale(1.04); opacity: .92; }
.discord-btn-label {
  font-family: 'DM Sans', sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.08em;
  color: #c7cfff;
  text-shadow: 0 0 6px rgba(143,160,255,0.8);
}

  .state-msg {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .admin-search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
  }
  .admin-search-box input {
    flex: 1;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 12px 20px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }
  .admin-search-box input:focus { border-color: var(--purple); }
  .admin-search-box button {
    background: linear-gradient(135deg, var(--purple), var(--purple-glow));
    color: #fff;
    border: none;
    padding: 0 24px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .04em;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .admin-search-box button:hover { opacity: 0.9; }
  .admin-search-hint { font-size: 12px; color: var(--ink-soft); margin: 0 0 22px; }

  .admin-search-list { display: flex; flex-direction: column; gap: 10px; }
  .admin-search-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 14px 18px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .admin-search-item:hover { border-color: var(--purple); }
  .admin-search-name { font-weight: 600; font-size: 14.5px; color: var(--ink); }
  .admin-search-meta { font-size: 12.5px; color: var(--ink-soft); }

  .admin-detail-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }
  .admin-detail-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 19px; }
  .admin-detail-meta { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }

  .calendar-panel {
    background: var(--surface-alt);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 22px;
    min-width: 0;
    align-self: start;
    max-height: calc(250vh - 120px);
    display: flex;
    flex-direction: column;
  }
  #calendarBody {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-right: 4px;
  }
  #calendarBody::-webkit-scrollbar { width: 6px; }
  #calendarBody::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }
  .calendar-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  .calendar-head h3 { margin: 0; font-size: 18px; font-weight: 700; }

  .calendar-day-group { margin-bottom: 16px; }
  .calendar-day-group:last-child { margin-bottom: 0; }
  .calendar-day-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .calendar-day-label {
    font-size: 12.5px; font-weight: 600; color: var(--ink-soft);
  }
  .calendar-day-group.is-today {
    background: var(--panel);
    border: 1px solid var(--purple);
    border-radius: 16px;
    padding: 12px 12px 4px;
    box-shadow: 0 8px 20px -14px var(--shadow);
  }
  .calendar-day-group.is-today .calendar-day-label {
    color: var(--purple-deep);
    font-weight: 700;
  }
  .calendar-today-tag {
    font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    background: var(--purple); color: #fff;
    padding: 2px 8px; border-radius: 999px;
  }
  .calendar-empty-today {
    font-size: 12.5px; color: var(--ink-soft);
    padding: 4px 0 10px;
  }

  .calendar-item {
    display: flex; align-items: flex-start; gap: 10px;
    margin-bottom: 12px;
  }
  .calendar-item:last-child { margin-bottom: 0; }
  .calendar-item-time {
    font-size: 12.5px; font-weight: 700; color: var(--ink);
    width: 44px; flex-shrink: 0; padding-top: 1px;
  }
  .calendar-item-content {
    position: relative;
    flex: 1;
    min-width: 0;
    padding-left: 13px;
  }
  .calendar-item-bar {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px; border-radius: 3px;
  }
  .calendar-item-bar.cat-live { background: var(--purple); }
  .calendar-item-bar.cat-recording { background: var(--teal); }
  .calendar-item-bar.cat-task { background: var(--orange); }

  .calendar-item-body { min-width: 0; }
  .calendar-item-cat {
    font-size: 11px; color: var(--ink-soft); margin-bottom: 1px;
  }
  .calendar-item-title {
    font-size: 13px; font-weight: 700; color: var(--ink);
    line-height: 1.35;
    white-space: pre-line;
  }
  .calendar-item-optional {
    font-size: 10px; font-weight: 700; color: var(--orange-deep);
    background: var(--orange-tint);
    border-radius: 6px; padding: 1px 6px; margin-left: 6px;
    white-space: nowrap;
  }

  @media (max-width: 1100px) {
    .shell { grid-template-columns: 220px 1fr; }
    .calendar-panel { grid-column: 1 / -1; order: 3; }
  }

  @media (max-width: 780px) {
    .shell { grid-template-columns: 1fr; padding: 24px 20px 28px; margin: 12px; gap: 26px; border-radius: 22px; }
    .calendar-panel { order: 3; }

    .sidebar { align-items: center; text-align: center; }
    .logo-mark { width: 44px; height: 44px; margin-bottom: 16px; }
    .avatar { width: 76px; height: 76px; font-size: 22px; margin-bottom: 18px; }
    .batch-badge { font-size: 11px; padding: 4px 12px; }
    .student-name { font-size: 17px; margin: 0 0 2px; }
    .student-id { margin-bottom: 22px; }

    nav { gap: 4px; }
    .nav-item { padding: 12px; text-align: left; }
    .soon-tag { margin-left: 8px; }

    .top-row { align-items: flex-start; gap: 12px; margin-bottom: 24px; }
    .greeting { flex: 1; min-width: 0; }
    .greeting h1 { font-size: 22px; line-height: 1.25; }
    .greeting .sub { font-size: 13px; margin-top: 4px; }
    .logout-btn { flex-shrink: 0; padding: 9px 14px; font-size: 11px; }
    .top-actions { gap: 8px; }
    .theme-toggle { padding: 6px 8px 6px 6px; }
    .theme-toggle-label { display: none; }

    .cards-row, .stats-grid { grid-template-columns: 1fr; gap: 14px; margin-bottom: 26px; }
    .card { padding: 18px; min-height: 0; }
    .card-body { margin-top: 14px; }
    .stat-box { padding: 16px; }
    .section-title { font-size: 17px; margin-bottom: 12px; }
  }

  @media (max-width: 420px) {
    .shell { padding: 20px 16px 24px; margin: 8px; }
    .greeting h1 { font-size: 20px; }
    .avatar { width: 68px; height: 68px; font-size: 20px; }
  }
</style>
</head>
<body>

<script>
  function applyTheme(theme) {
    if (theme === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      document.getElementById('themeToggleIcon').textContent = '🌙';
      document.getElementById('themeToggleLabel').textContent = 'Mode Gelap';
    } else {
      document.documentElement.removeAttribute('data-theme');
      document.getElementById('themeToggleIcon').textContent = '☀️';
      document.getElementById('themeToggleLabel').textContent = 'Mode Cerah';
    }
  }

  const THEME_KEY = 'sgr-theme';

  function toggleTheme() {
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    const next = isLight ? 'dark' : 'light';
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  }

  function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    applyTheme(saved === 'light' ? 'light' : 'dark');
  }

  window.addEventListener('storage', (e) => {
    if (e.key === THEME_KEY) {
      applyTheme(e.newValue === 'light' ? 'light' : 'dark');
    }
  });

  initTheme();

  const LEET_ABS_LLR = atob("aHR0cHM6Ly9kb2NzLmdvb2dsZS5jb20vc3ByZWFkc2hlZXRzL2Qv");
  const LLETS_GGIZ_RALTH = atob("L2d2aXovdHE/Z2lkPQ==");

  function jisencord(value) {
    if (typeof value === "string" && value.indexOf("c69:") === 0) return atob(value.slice(4));
    return value;
  }

  const IP_LEATH = {
    "34": {
      id: jisencord("c69:MU1HWURVUDB3cGVjSjVUNF80N210Rl9BRzFVdXhxYmwwd01iMGNYUFc4alk="),

  function resolveBatchSheet(batch) {

  function buildFilteredUrl(sheetId, gid, studentId) {
    const safeId = studentId.toString().trim().replace(/[^0-9]/g, "");
    const tq = `select * where A = ${safeId} or A = '${safeId}'`;
    return `${LEET_ABS_LLR}${sheetId}${LLETS_GGIZ_RALTH}${gid}&headers=2&tqx=out:csv&tq=${encodeURIComponent(tq)}`;
  }

  function buildCellUrl(sheetId, gid, cell) {
    return `${LEET_ABS_LLR}${sheetId}${LLETS_GGIZ_RALTH}${gid}&range=${cell}&tqx=out:csv`;
  }

  function buildAllRowsUrl(sheetId, gid) {
    const tq = `select *`;
    // Jadwal tab's real header row is row 2 (row 1 is left blank), same as
    // Master Students / Portfolio Status — hence headers=2, not headers=1.
    return `${LEET_ABS_LLR}${sheetId}${LLETS_GGIZ_RALTH}${gid}&headers=2&tqx=out:csv&tq=${encodeURIComponent(tq)}`;
  }

  function isValidDiscordLink(url) {
    return typeof url === "string" && /^https:\/\/(discord\.gg\/|discord\.com\/invite\/)/i.test(url.trim());
  }

  function fetchCellValue(sheetId, gid, cell, cacheKey) {
    const ck = cacheKey ? `${cacheKey}_${sheetId}_${cell}` : null;
    if (ck) {
      const cached = getCache(ck);
      if (cached !== null) return Promise.resolve(cached);
    }
    const url = buildCellUrl(sheetId, gid, cell);
    return new Promise((resolve) => {
      Papa.parse(url, {
        download: true,
        skipEmptyLines: false,
        complete: (results) => {
          const value = (results.data[0] && results.data[0][0]) ? String(results.data[0][0]).trim() : "";
          if (ck) setCache(ck, value);
          resolve(value);
        },
        error: () => resolve(""),
      });
    });
  }

  const MASTER_TOTAL_SCORE_COL = 6;
  const MASTER_COMPLETION_RATE_COL = 7;
  const PORTFOLIO_STATUS_COL = 15; // Column P = "PORTO APPROVAL"
  const TOTAL_MAX_SCORE = 5400;

  const HOF_AVAILABLE_BATCHES = ["34"];

  const SERVICE_KEYWORDS = [
    { keyword: /\bEM\b/i,           service: "Email Marketing" },
    { keyword: /\bLG\b/i,           service: "Lead Generation" },
    { keyword: /\bSMM\b/i,          service: "Social Media Management" },
    { keyword: /Email.*Marketing/i, service: "Email Marketing" },
    { keyword: /Lead.*Gen/i,        service: "Lead Generation" },
    { keyword: /Social.*Media/i,    service: "Social Media Management" },
  ];

  const HIGHLIGHT_CANONICAL = {
    "LEAD GENERATION":         "Lead Generation",
    "EMAIL MARKETING":         "Email Marketing",
    "SMM":                     "Social Media Management",
    "SOCIAL MEDIA MANAGEMENT": "Social Media Management",
    "Lead Generation":         "Lead Generation",
    "Email Marketing":         "Email Marketing",
    "Social Media Management": "Social Media Management",
  };

  const HIGHLIGHT_SKIP = {
    "Lead Generation":         ["Email Marketing", "Social Media Management"],
    "Email Marketing":         ["Lead Generation", "Social Media Management"],
    "Social Media Management": ["Lead Generation", "Email Marketing"],
  };

  const ICONS = {
    check: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`,
    clock: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>`,
    target: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8" fill="#fff"/></svg>`,
  };

  const CACHE_TTL_MS = 5 * 60 * 1000;
  const CACHE_PREFIX = "sgr_cache_v2_";

  function getCache(key) {
    try {
      const raw = sessionStorage.getItem(CACHE_PREFIX + key);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (Date.now() - parsed.ts > CACHE_TTL_MS) return null;
      return parsed.data;
    } catch (e) {
      return null;
    }
  }

  function setCache(key, data) {
    try {
      sessionStorage.setItem(CACHE_PREFIX + key, JSON.stringify({ ts: Date.now(), data }));
    } catch (e) {}
  }

  function fetchFilteredRow(sheetId, gid, studentId, cacheKey) {
    const ck = cacheKey ? `${cacheKey}_${sheetId}_${studentId}` : null;
    if (ck) {
      const cached = getCache(ck);
      if (cached) return Promise.resolve(cached);
    }
    const url = buildFilteredUrl(sheetId, gid, studentId);
    return new Promise((resolve, reject) => {
      Papa.parse(url, {
        download: true,
        skipEmptyLines: false,
        complete: (results) => {
          const headerRow = results.data[0] || [];
          const studentRow = results.data[1] || null;

          const shaped = studentRow ? [[], headerRow, studentRow] : [[], headerRow];
          if (ck) setCache(ck, shaped);
          resolve(shaped);
        },
        error: (err) => reject(err),
      });
    });
  }

  function fetchAllRows(sheetId, gid, cacheKey) {
    const ck = cacheKey ? `${cacheKey}_${sheetId}_${gid}` : null;
    if (ck) {
      const cached = getCache(ck);
      if (cached) return Promise.resolve(cached);
    }
    const url = buildAllRowsUrl(sheetId, gid);
    return new Promise((resolve, reject) => {
      Papa.parse(url, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: (results) => {
          const rows = results.data || [];
          if (ck) setCache(ck, rows);
          resolve(rows);
        },
        error: (err) => reject(err),
      });
    });
  }

  function findStudentRow(rows, studentId) {
    for (let i = 2; i < rows.length; i++) {
      const row = rows[i];
      if (row[0] && row[0].toString().trim() === studentId.toString().trim()) {
        return row;
      }
    }
    return null;
  }

  function computeTaskStats(row, headerRow, highlightService) {
    let completed = 0;
    let pending = 0;
    const skipList = HIGHLIGHT_SKIP[highlightService] || [];
    const headers = headerRow || [];

    for (let idx = 0; idx < headers.length; idx++) {
      const headerLabel = (headers[idx] || "").toString();

      if (!headerLabel.toLowerCase().includes("score")) continue;
      if (headerLabel.trim() === "Total Score") continue;

      let taskService = null;
      for (const { keyword, service } of SERVICE_KEYWORDS) {
        if (keyword.test(headerLabel)) { taskService = service; break; }
      }
      if (taskService && skipList.includes(taskService)) continue;

      const scoreRaw = (row[idx] || "").toString().trim();
      if (!scoreRaw || scoreRaw === "0") {
        pending++;
      } else {
        completed++;
      }
    }

    return { completed, pending };
  }

  function readTotalScore(row) {
    const raw = (row[MASTER_TOTAL_SCORE_COL] || "0").toString().trim();
    const num = parseFloat(raw.replace(/[^0-9.\-]/g, ""));
    return isNaN(num) ? 0 : num;
  }

  function readCompletionRate(row) {
    const raw = (row[MASTER_COMPLETION_RATE_COL] || "0").toString().trim();
    const num = parseFloat(raw.replace("%", "").trim());
    return isNaN(num) ? 0 : Math.round(num * 10) / 10;
  }

  const ALL_CAPS_WORDS = ["SMM", "EM", "LG"];

  function titleCaseService(raw) {
    if (!raw) return "—";
    return raw
      .trim()
      .split(" ")
      .map((w) => {
        const upper = w.toUpperCase();
        if (ALL_CAPS_WORDS.includes(upper)) return upper;
        return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
      })
      .join(" ");
  }

  function initials(name) {
    if (!name) return "??";
    return name
      .trim()
      .split(/\s+/)
      .slice(0, 2)
      .map((w) => w[0])
      .join("")
      .toUpperCase();
  }

  function renderPortfolioPill(statusRaw) {
    const status = (statusRaw || "").toString().trim();
    const lower = status.toLowerCase();

    if (!status) {
      return `<span class="status-pill status-pending">Belum di Review</span>`;
    }

    let colorClass = "status-pending"; // default: oranye
    if (lower.startsWith("approve")) {
      colorClass = "status-approved"; // hijau
    } else if (lower.startsWith("major")) {
      colorClass = "status-rejected"; // merah
    } else if (lower.startsWith("minor")) {
      colorClass = "status-pending"; // oranye
    }

    return `<span class="status-pill ${colorClass}">${status}</span>`;
  }

  function renderCongratPills(completedPct, totalScore) {
    const pills = [];
    if (completedPct >= 100) {
      pills.push(`<span class="congrat-pill"><span class="dot"></span>Congrat 100% Completion</span>`);
    }
    if (totalScore >= TOTAL_MAX_SCORE) {
      pills.push(`<span class="congrat-pill"><span class="dot"></span>Congrat Full Score! 🎉</span>`);
    }
    return pills.join("");
  }

  function renderDiscordButton(discordLink) {
    if (!discordLink) return "";
    return `
      <a class="discord-btn" href="${discordLink}" target="_blank" rel="noopener noreferrer" aria-label="Join Discord">
        <span class="discord-btn-label">JOIN</span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="#8fa0ff" style="filter:drop-shadow(0 0 4px rgba(143,160,255,0.9))"><path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.099.246.198.373.292a.077.077 0 0 1-.006.127c-.598.35-1.22.645-1.873.892a.076.076 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.001-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.673-3.549-13.66a.06.06 0 0 0-.031-.028zM8.02 15.331c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.211 0 2.176 1.094 2.157 2.418 0 1.334-.955 2.419-2.157 2.419zm7.974 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.211 0 2.176 1.094 2.157 2.418 0 1.334-.946 2.419-2.157 2.419z"/></svg>
      </a>`;
  }

  function renderBottomRow(completedPct, totalScore, discordLink) {
    const pillsHtml = renderCongratPills(completedPct, totalScore);
    const discordHtml = renderDiscordButton(discordLink);
    if (!pillsHtml && !discordHtml) return "";
    return `<div class="congrat-row">
      <div class="congrat-pills-wrap">${pillsHtml}</div>
      ${discordHtml}
    </div>`;
  }

  const CATEGORY_META = {
    "Live Lesson":   { cls: "cat-live",      label: "Live Lesson" },
    "Recording":     { cls: "cat-recording", label: "Recording" },
    "Task Deadline": { cls: "cat-task",      label: "Task Deadline" },
  };

  const DAY_LABEL_ID = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
  const MONTH_LABEL_ID = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];

  function getJktNow() {
    const utcNow = new Date(Date.now());
    const jktMs = utcNow.getTime() + utcNow.getTimezoneOffset() * 60000 + 7 * 3600000;
    return new Date(jktMs);
  }

  function toDateKey(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function getWeekRange(todayJkt) {
    const dow = todayJkt.getDay();
    const diffToMonday = dow === 0 ? -6 : 1 - dow;
    const monday = new Date(todayJkt);
    monday.setDate(todayJkt.getDate() + diffToMonday);
    monday.setHours(0, 0, 0, 0);
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      days.push(d);
    }
    return days;
  }

  function parseSheetDateToKey(raw) {
    const str = (raw || "").toString().trim();
    if (!str) return "";

    // Already YYYY-MM-DD (optionally with a time suffix like "2026-08-31 0:00:00")
    let m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) {
      return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
    }

    // Google's gviz CSV export commonly formats Date-type cells as M/D/YYYY
    // (or M/D/YYYY H:MM:SS) regardless of the sheet's display format
    m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (m) {
      return `${m[3]}-${m[1].padStart(2, "0")}-${m[2].padStart(2, "0")}`;
    }

    // Fallback: let the JS Date parser take a shot at it
    const d = new Date(str);
    if (!isNaN(d.getTime())) return toDateKey(d);

    return str;
  }

  function groupJadwalByDate(jadwalRows) {
    const map = {};
    for (const row of jadwalRows) {
      const dateKey = parseSheetDateToKey(row["Date"]);
      if (!dateKey) continue;
      if (!map[dateKey]) map[dateKey] = [];
      map[dateKey].push(row);
    }
    for (const key in map) {
      map[key].sort((a, b) => (a["Time"] || "").localeCompare(b["Time"] || ""));
    }
    return map;
  }

  function renderCalendarItem(row) {
    const category = (row["Category"] || "").toString().trim();
    const meta = CATEGORY_META[category] || { cls: "cat-task", label: category || "Event" };
    const time = (row["Time"] || "").toString().trim().replace(/\s*JKT\s*/i, "");
    const title = (row["Title"] || "").toString().trim().replace(/\r\n?/g, "\n");
    const isOptional = (row["Optional"] || "").toString().trim().toUpperCase() === "TRUE";

    return `
      <div class="calendar-item">
        <div class="calendar-item-time">${time}</div>
        <div class="calendar-item-content">
          <div class="calendar-item-bar ${meta.cls}"></div>
          <div class="calendar-item-body">
            <div class="calendar-item-cat">${meta.label}</div>
            <div class="calendar-item-title">${title}${isOptional ? '<span class="calendar-item-optional">Optional</span>' : ""}</div>
          </div>
        </div>
      </div>
    `;
  }

  function renderCalendarPanel(jadwalRows) {
    const panel = document.getElementById("calendarPanel");
    const body = document.getElementById("calendarBody");
    if (!panel || !body) return;

    if (!jadwalRows || jadwalRows.length === 0) {
      panel.style.display = "none";
      return;
    }

    const todayJkt = getJktNow();
    const todayKey = toDateKey(todayJkt);
    const weekDays = getWeekRange(todayJkt);
    const grouped = groupJadwalByDate(jadwalRows);

    const html = weekDays.map((d) => {
      const key = toDateKey(d);
      const isToday = key === todayKey;
      const dayLabel = `${DAY_LABEL_ID[d.getDay()]}, ${d.getDate()} ${MONTH_LABEL_ID[d.getMonth()]}`;
      const items = grouped[key] || [];

      let itemsHtml;
      if (items.length === 0) {
        itemsHtml = `<div class="calendar-empty-today">${isToday ? "Tidak ada jadwal hari ini 🎉" : "Tidak ada jadwal"}</div>`;
      } else {
        itemsHtml = items.map(renderCalendarItem).join("");
      }

      return `
        <div class="calendar-day-group${isToday ? " is-today" : ""}">
          <div class="calendar-day-head">
            <span class="calendar-day-label">${dayLabel}</span>
            ${isToday ? '<span class="calendar-today-tag">Hari ini</span>' : ""}
          </div>
          ${itemsHtml}
        </div>
      `;
    }).join("");

    body.innerHTML = html || `<div class="calendar-empty-today">Belum ada jadwal minggu ini.</div>`;
    panel.style.display = "block";
  }

  function ringSvg(pct, idSuffix) {
    const r = 26;
    const circumference = 2 * Math.PI * r;
    const offset = circumference - (pct / 100) * circumference;
    return `
      <div class="ring-wrap">
        <svg width="64" height="64" viewBox="0 0 64 64">
          <circle class="ring-track" cx="32" cy="32" r="${r}" />
          <circle class="ring-fill" cx="32" cy="32" r="${r}"
            stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" />
        </svg>
        <div class="ring-label">${pct}%</div>
      </div>
    `;
  }

  function renderDashboard({ nama, batch, hids, completed, pending, completedPct, pendingPct, totalScore, portfolioStatus, discordLink }) {
    document.getElementById("avatarInitials").innerHTML = `
      ${initials(nama)}
      <span class="batch-badge">Batch ${batch || "—"}</span>
    `;
    document.getElementById("studentName").textContent = nama;
    document.getElementById("greetingName").textContent = `Hello, ${nama}`;

    document.getElementById("dashboardBody").innerHTML = `
      <section class="cards-row">
        <div class="card card-selesai">
          <div class="card-head">
            <h3>Task Selesai</h3>
            <div class="card-icon">${ICONS.check}</div>
          </div>
          <div class="card-body">
            ${ringSvg(completedPct, "done")}
            <div class="card-stat-text">
              <div class="count">${completed}</div>
              <div class="label">dari ${completed + pending} task</div>
            </div>
          </div>
        </div>

        <div class="card card-belum">
          <div class="card-head">
            <h3>Task yg Belum</h3>
            <div class="card-icon">${ICONS.clock}</div>
          </div>
          <div class="card-body">
            ${ringSvg(pendingPct, "pending")}
            <div class="card-stat-text">
              <div class="count">${pending}</div>
              <div class="label">masih tersisa</div>
            </div>
          </div>
        </div>

        <div class="card card-hids">
          <div class="card-head">
            <h3>HIDS</h3>
            <div class="card-icon">${ICONS.target}</div>
          </div>
          <div class="card-body">
            <span class="hids-tag">Highlight Service</span>
            <div class="hids-value">${hids}</div>
          </div>
        </div>
      </section>

      <h2 class="section-title">Statistics</h2>
      <section class="stats-grid">
        <div class="stat-box">
          <div class="big">${completedPct}%</div>
          <div class="label">% Completion</div>
        </div>
        <div class="stat-box">
          <div class="big">${totalScore.toLocaleString("id-ID")}</div>
          <div class="label">Total Score</div>
        </div>
        <div class="stat-box">
          <div class="big">${renderPortfolioPill(portfolioStatus)}</div>
          <div class="label">Portfolio</div>
        </div>
      </section>

      ${renderBottomRow(completedPct, totalScore, discordLink)}
    `;
  }

  function renderAdminHome(session) {
    document.getElementById("avatarInitials").innerHTML = `
      ${initials(session.nama || "Admin")}
      <span class="batch-badge">Admin</span>
    `;
    document.getElementById("studentName").textContent = session.nama || "Admin";
    document.getElementById("greetingName").textContent = `Hello, ${session.nama || "Admin"}`;

    document.getElementById("dashboardBody").innerHTML = `
      <div class="admin-search-box">
        <input type="text" id="adminSearchInput" placeholder="Check Status Student dengan isi Student ID atau Nama..." />
        <button onclick="adminSearchStudent()">Cari</button>
      </div>
      
      <div id="adminSearchResults"></div>
    `;

    const input = document.getElementById("adminSearchInput");
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") adminSearchStudent();
    });
    input.focus();
  }

  function buildAdminSearchUrl(sheetId, gid, query, isNumeric) {
    let tq;
    if (isNumeric) {
      const safeId = query.toString().trim().replace(/[^0-9]/g, "");
      tq = `select * where A = ${safeId}`;
    } else {
      const escaped = query.toString().trim().replace(/'/g, "\\'");
      tq = `select * where upper(B) contains upper('${escaped}')`;
    }
    return `${LEET_ABS_LLR}${sheetId}${LLETS_GGIZ_RALTH}${gid}&headers=2&tqx=out:csv&tq=${encodeURIComponent(tq)}`;
  }

  function fetchAdminSearchRows(sheetId, gid, query, isNumeric) {
    const url = buildAdminSearchUrl(sheetId, gid, query, isNumeric);
    return new Promise((resolve) => {
      Papa.parse(url, {
        download: true,
        skipEmptyLines: false,
        complete: (results) => {
          const headerRow = results.data[0] || [];
          const rows = (results.data.slice(1) || []).filter((r) => r && r[0]);
          resolve({ headerRow, rows });
        },
        error: () => resolve({ headerRow: [], rows: [] }),
      });
    });
  }

  async function adminSearchStudent() {
    const input = document.getElementById("adminSearchInput");
    const query = (input.value || "").trim();
    const resultsBox = document.getElementById("adminSearchResults");
    if (!query) return;

    resultsBox.innerHTML = `<div class="state-msg" style="padding:30px 0;">Mencari...</div>`;

    const isNumeric = /^[0-9]+$/.test(query);
    const batchKeys = Object.keys(IP_LEATH);
    const allMatches = [];

    await Promise.all(batchKeys.map(async (batchKey) => {
      const sheet = IP_LEATH[batchKey];
      if (!sheet || !sheet.id || sheet.id === "batch_id") return; // batch belum dikonfigurasi
      try {
        const { headerRow, rows } = await fetchAdminSearchRows(sheet.id, sheet.gidMaster, query, isNumeric);
        rows.forEach((row) => allMatches.push({ batchKey, headerRow, row }));
      } catch (e) {
        console.error(`Gagal mencari di batch ${batchKey}:`, e);
      }
    }));

    if (allMatches.length === 0) {
      resultsBox.innerHTML = `<div class="state-msg" style="padding:30px 0;">Siswa tidak ditemukan di batch manapun.</div>`;
      return;
    }

    if (allMatches.length === 1) {
      renderAdminStudentDetail(allMatches[0]);
      return;
    }

    window.__adminSearchMatches = allMatches;
    resultsBox.innerHTML = `
      <div class="admin-search-list">
        ${allMatches.map((m, i) => `
          <button class="admin-search-item" onclick="renderAdminStudentDetailByIndex(${i})">
            <span class="admin-search-name">${m.row[1] || "—"}</span>
            <span class="admin-search-meta">ID ${m.row[0] || "—"} · Batch ${m.batchKey}</span>
          </button>
        `).join("")}
      </div>`;
  }

  function renderAdminStudentDetailByIndex(i) {
    const match = (window.__adminSearchMatches || [])[i];
    if (match) renderAdminStudentDetail(match);
  }

  async function renderAdminStudentDetail(match) {
    const { batchKey, headerRow, row } = match;
    const resultsBox = document.getElementById("adminSearchResults");
    resultsBox.innerHTML = `<div class="state-msg" style="padding:30px 0;">Memuat detail siswa...</div>`;

    const sheet = IP_LEATH[batchKey];
    const studentId = row[0];

    try {
      const [portfolioRows, discordCell] = await Promise.all([
        fetchFilteredRow(sheet.id, sheet.gidPortfolio, studentId, "admin_portfolio_row"),
        fetchCellValue(sheet.id, sheet.gidMaster, "A1", "discord_cell"),
      ]);

      const portfolioRow = findStudentRow(portfolioRows, studentId);
      const portfolioStatus = portfolioRow ? portfolioRow[PORTFOLIO_STATUS_COL] : "";

      const hidsRaw = row[4];
      const hidsTrim = (hidsRaw || "").toString().trim();
      const highlightCanonical = HIGHLIGHT_CANONICAL[hidsTrim] || HIGHLIGHT_CANONICAL[hidsTrim.toUpperCase()] || hidsTrim;
      const { completed, pending } = computeTaskStats(row, headerRow, highlightCanonical);
      const totalScore = readTotalScore(row);
      const completedPct = readCompletionRate(row);
      const pendingPct = Math.round((100 - completedPct) * 10) / 10;
      const discordLink = isValidDiscordLink(discordCell) ? discordCell.trim() : "";

      resultsBox.innerHTML = `
        <div class="admin-detail-head">
          <div>
            <div class="admin-detail-name">${row[1] || "—"}</div>
            <div class="admin-detail-meta">ID ${studentId} · Batch ${batchKey}</div>
          </div>
          <button class="logout-btn" style="background:var(--purple-deep)" onclick="backToAdminSearch()">← Cari Lagi</button>
        </div>

        <section class="cards-row">
          <div class="card card-selesai">
            <div class="card-head">
              <h3>Task Selesai</h3>
              <div class="card-icon">${ICONS.check}</div>
            </div>
            <div class="card-body">
              ${ringSvg(completedPct, "done")}
              <div class="card-stat-text">
                <div class="count">${completed}</div>
                <div class="label">dari ${completed + pending} task</div>
              </div>
            </div>
          </div>

          <div class="card card-belum">
            <div class="card-head">
              <h3>Task yg Belum</h3>
              <div class="card-icon">${ICONS.clock}</div>
            </div>
            <div class="card-body">
              ${ringSvg(pendingPct, "pending")}
              <div class="card-stat-text">
                <div class="count">${pending}</div>
                <div class="label">masih tersisa</div>
              </div>
            </div>
          </div>

          <div class="card card-hids">
            <div class="card-head">
              <h3>HIDS</h3>
              <div class="card-icon">${ICONS.target}</div>
            </div>
            <div class="card-body">
              <span class="hids-tag">Highlight Service</span>
              <div class="hids-value">${titleCaseService(hidsRaw)}</div>
            </div>
          </div>
        </section>

        <h2 class="section-title">Statistics</h2>
        <section class="stats-grid">
          <div class="stat-box">
            <div class="big">${completedPct}%</div>
            <div class="label">% Completion</div>
          </div>
          <div class="stat-box">
            <div class="big">${totalScore.toLocaleString("id-ID")}</div>
            <div class="label">Total Score</div>
          </div>
          <div class="stat-box">
            <div class="big">${renderPortfolioPill(portfolioStatus)}</div>
            <div class="label">Portfolio</div>
          </div>
        </section>

        ${renderBottomRow(completedPct, totalScore, discordLink)}
      `;
    } catch (e) {
      console.error(e);
      resultsBox.innerHTML = `
        <div class="state-msg" style="padding:30px 0;">
          Gagal memuat detail siswa.
          <div style="margin-top:14px">
            <button class="logout-btn" style="background:var(--purple-deep)" onclick="backToAdminSearch()">Kembali</button>
          </div>
        </div>`;
    }
  }

  function backToAdminSearch() {
    const resultsBox = document.getElementById("adminSearchResults");
    if (resultsBox) resultsBox.innerHTML = "";
    const input = document.getElementById("adminSearchInput");
    if (input) { input.value = ""; input.focus(); }
  }

  function renderError(message) {
    document.getElementById("dashboardBody").innerHTML = `
      <div class="state-msg">
        ${message}
        <div style="margin-top:14px">
          <button class="logout-btn" style="background:var(--purple-deep)" onclick="init()">Coba Lagi</button>
        </div>
      </div>`;
  }

  function withTimeout(promise, ms, label) {
    return Promise.race([
      promise,
      new Promise((_, reject) =>
        setTimeout(() => reject(new Error(`${label} timeout setelah ${ms / 1000}s`)), ms)
      ),
    ]);
  }

  function normalizeBatch(batch) {
    return String(batch || "").replace(/[^0-9]/g, "");
  }

  function updateHallOfFameNav(batch, isAdmin) {
    const el = document.getElementById("hofNavItem");
    if (!el) return;
    const isAvailable = isAdmin || HOF_AVAILABLE_BATCHES.includes(normalizeBatch(batch));
    if (!isAvailable) return;

    const link = document.createElement("a");
    link.className = "nav-item link";
    link.href = "../hall-of-fame/hall-of-fame.html";
    link.innerHTML = `
      <span class="nav-icon nav-icon-gold">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h2a2 2 0 0 1 2 2 4 4 0 0 1-4 4"/><path d="M7 5H5a2 2 0 0 0-2 2 4 4 0 0 0 4 4"/></svg>
      </span>
      Hall of Fame
    `;
    el.replaceWith(link);
  }

  async function init() {
    document.getElementById("dashboardBody").innerHTML = `<div class="state-msg">Memuat data kamu...</div>`;

    const sessionPromise = withTimeout(checkLogin(), 15000, "Verifikasi login");

    let session;
    try {
      session = await sessionPromise;
    } catch (err) {
      console.error(err);
      renderError("Gagal verifikasi login (server mungkin lambat merespons). Coba lagi ya.");
      return;
    }
    if (!session) return;

    document.getElementById("studentIdLabel").textContent = session.studentId;
    if (session.isAdmin) {
      document.getElementById("adminTag").style.display = "inline-block";
    }
    updateHallOfFameNav(session.batch, session.isAdmin);

    const batchSheet = resolveBatchSheet(session.batch);
    if (!batchSheet) {
      if (session.isAdmin) {
        renderAdminHome(session);
      } else {
        renderError(`Sheet untuk Batch ${session.batch || "-"} belum terdaftar. Hubungi admin untuk menambahkan konfigurasinya.`);
      }
      return;
    }

    const jadwalPromise = (batchSheet.gidJadwal !== undefined && batchSheet.gidJadwal !== null)
      ? fetchAllRows(batchSheet.id, batchSheet.gidJadwal, "jadwal_rows").catch((err) => {
          console.error("Gagal memuat jadwal:", err);
          return [];
        })
      : Promise.resolve([]);

    const dataPromise = withTimeout(
      Promise.all([
        fetchFilteredRow(batchSheet.id, batchSheet.gidMaster, session.studentId, "master_row"),
        fetchFilteredRow(batchSheet.id, batchSheet.gidPortfolio, session.studentId, "portfolio_row"),
        fetchCellValue(batchSheet.id, batchSheet.gidMaster, "A1", "discord_cell"),
        jadwalPromise,
      ]),
      15000,
      "Ambil data"
    );

    try {
      const [masterRows, portfolioRows, discordCell, jadwalRows] = await dataPromise;

      const masterRow = findStudentRow(masterRows, session.studentId);
      if (!masterRow) {
        renderError("Data kamu tidak ditemukan di Master Students. Hubungi admin ya.");
        return;
      }

      const hidsRaw = masterRow[4];
      const hidsTrim = (hidsRaw || "").toString().trim();
      const highlightCanonical = HIGHLIGHT_CANONICAL[hidsTrim] || HIGHLIGHT_CANONICAL[hidsTrim.toUpperCase()] || hidsTrim;
      const { completed, pending } = computeTaskStats(masterRow, masterRows[1], highlightCanonical);
      const totalScore = readTotalScore(masterRow);
      const completedPct = readCompletionRate(masterRow);
      const pendingPct = Math.round((100 - completedPct) * 10) / 10;

      const portfolioRow = findStudentRow(portfolioRows, session.studentId);
      const portfolioStatus = portfolioRow ? portfolioRow[PORTFOLIO_STATUS_COL] : "";

      const discordLink = isValidDiscordLink(discordCell) ? discordCell.trim() : "";

      renderDashboard({
        nama: session.nama || masterRow[1],
        batch: session.batch,
        hids: titleCaseService(hidsRaw),
        completed,
        pending,
        completedPct,
        pendingPct,
        totalScore,
        portfolioStatus,
        discordLink,
      });

      renderCalendarPanel(jadwalRows);
    } catch (err) {
      console.error(err);
      renderError("Gagal memuat data (server mungkin lambat merespons). Coba lagi ya.");
    }
  }

  init();
</script>
