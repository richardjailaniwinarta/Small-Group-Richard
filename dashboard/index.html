<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — SG Richard Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --cream: #F4EEE3;
    --panel: #FFFFFF;
    --ink: #262129;
    --ink-soft: #6E6875;
    --purple: #5A3E85;
    --purple-deep: #4A3170;
    --purple-glow: #8A6FC2;
    --teal: #8FD6CE;
    --teal-deep: #3E9C92;
    --teal-glow: #6FCFC3;
    --orange: #E58A4F;
    --orange-deep: #C96F36;
    --orange-glow: #F0A465;
    --line: #ECE5D8;
    --purple-tint: #ECE6F5;
    --teal-tint: #E3F5F2;
    --orange-tint: #FBEEE3;
    --gold: #B98A2E;
    --gold-tint: #F5ECD9;
    --radius-lg: 28px;
    --radius-md: 18px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  h1, h2, h3, .display {
    font-family: 'Fraunces', serif;
  }

  /* decorative background shapes */
  .blob {
    position: fixed;
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
  }
  .blob-teal { width: 260px; height: 260px; background: var(--teal); opacity: .55; left: -90px; bottom: -90px; }
  .blob-orange { width: 190px; height: 190px; background: var(--orange); opacity: .5; left: 40px; bottom: -110px; }

  .shell {
    position: relative;
    z-index: 1;
    max-width: 1180px;
    margin: 40px auto;
    padding: 40px;
    background: var(--panel);
    border-radius: var(--radius-lg);
    box-shadow: 0 30px 60px -30px rgba(70, 50, 30, 0.18);
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 44px;
  }

  /* Sidebar */
  .sidebar { display: flex; flex-direction: column; align-items: flex-start; }
  .logo-mark {
    width: 52px; height: 52px; border-radius: 14px;
    background: #FBF8F1;
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 30px;
    padding: 6px;
  }
  .logo-mark img { width: 100%; height: 100%; object-fit: contain; }

  .avatar {
    width: 100px; height: 100px; border-radius: 50%;
    background: var(--purple);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif;
    font-size: 30px; font-weight: 600;
    position: relative;
    margin-bottom: 14px;
  }
  .batch-badge {
    position: absolute;
    bottom: -10px;
    background: var(--orange);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 14px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .student-name { font-size: 18px; font-weight: 600; margin: 18px 0 2px; }
  .student-id { font-size: 13px; color: var(--ink-soft); margin-bottom: 32px; }

  nav { display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    width: 100%;
    padding: 9px 10px;
    border-radius: 14px;
    font-size: 14.5px; font-weight: 500; color: var(--ink-soft);
    text-decoration: none;
    cursor: default;
    transition: background .15s, color .15s;
  }
  .nav-icon {
    width: 32px; height: 32px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background .15s, color .15s;
  }
  .nav-icon svg { width: 16px; height: 16px; stroke: currentColor; }
  .nav-icon-purple { background: var(--purple-tint); color: var(--purple-deep); }
  .nav-icon-teal { background: var(--teal-tint); color: var(--teal-deep); }
  .nav-icon-orange { background: var(--orange-tint); color: var(--orange-deep); }
  .nav-icon-gold { background: var(--gold-tint); color: var(--gold); }

  .nav-item.active { background: #F7F3EB; color: var(--ink); font-weight: 700; }
  .nav-item.active .nav-icon-purple { background: var(--purple-deep); color: #fff; }
  .nav-item.active .nav-icon-teal { background: var(--teal-deep); color: #fff; }
  .nav-item.active .nav-icon-orange { background: var(--orange-deep); color: #fff; }
  .nav-item.active .nav-icon-gold { background: var(--gold); color: #fff; }

  .nav-item.link { cursor: pointer; }
  .nav-item.link:hover { background: #F7F3EB; color: var(--ink); }

  .nav-item.disabled { opacity: .6; }
  .soon-tag {
    margin-left: auto;
    font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    background: #F1EDE3; color: var(--ink-soft);
    padding: 3px 8px; border-radius: 999px;
    white-space: nowrap;
  }

  .logout-mini {
    margin-top: auto;
    padding-top: 30px;
    font-size: 13px;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
  }

  /* Main content */
  main { min-width: 0; }
  .top-row {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 30px;
  }
  .greeting h1 { font-size: 32px; margin: 0; font-weight: 600; }
  .greeting .sub { color: var(--ink-soft); font-size: 14px; margin-top: 6px; }

  .logout-btn {
    display: flex; align-items: center; gap: 8px;
    background: var(--ink);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .06em;
    cursor: pointer;
    text-transform: uppercase;
  }

  .cards-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 34px;
  }
  .card {
    position: relative;
    border-radius: var(--radius-md);
    padding: 22px;
    color: #fff;
    min-height: 176px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
    isolation: isolate;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: -1;
    opacity: .5;
    background-image: radial-gradient(circle, rgba(255,255,255,.16) 1.5px, transparent 1.5px);
    background-size: 14px 14px;
  }
  .card::after {
    content: '';
    position: absolute;
    width: 150px; height: 150px;
    border-radius: 50%;
    right: -50px; top: -60px;
    background: rgba(255,255,255,.10);
    z-index: -1;
  }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card h3 { font-size: 20px; margin: 0; font-weight: 600; }
  .card-icon {
    width: 34px; height: 34px; border-radius: 10px;
    background: rgba(255,255,255,.18);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .card-icon svg { width: 18px; height: 18px; }

  .card-body { display: flex; align-items: center; gap: 16px; margin-top: 10px; }
  .ring-wrap { position: relative; width: 64px; height: 64px; flex-shrink: 0; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-track { fill: none; stroke: rgba(255,255,255,.28); stroke-width: 6; }
  .ring-fill { fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
  .ring-label {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 14px;
  }
  .card-stat-text .count { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 600; line-height: 1; }
  .card-stat-text .label { font-size: 12px; opacity: .88; margin-top: 4px; }

  .card-selesai { background: linear-gradient(155deg, var(--purple), var(--purple-deep)); }
  .card-belum { background: linear-gradient(155deg, var(--teal-glow), var(--teal-deep)); }
  .card-hids { background: linear-gradient(155deg, var(--orange-glow), var(--orange-deep)); }
  .card-hids .card-body { align-items: flex-start; flex-direction: column; gap: 8px; margin-top: 16px; }
  .card-hids .hids-value { font-family: 'Fraunces', serif; font-size: 21px; font-weight: 600; }
  .card-hids .hids-tag {
    font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    background: rgba(255,255,255,.2); padding: 4px 10px; border-radius: 999px;
  }

  .section-title { font-size: 20px; font-weight: 600; margin: 0 0 16px; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  .stat-box {
    background: #F7F3EB;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 20px;
  }
  .stat-box .big { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .stat-box .label { font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; }

  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
  }
  .status-approved { background: #E4F5EA; color: #2C8A55; }
  .status-pending { background: #F1EDE3; color: #8A7A55; }
  .status-rejected { background: #FBE7E4; color: #C24A3C; }

  .congrat-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 16px;
  }
  .congrat-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 700;
    background: #E4F5EA;
    color: #2C8A55;
    border: 1px solid #BFE6CE;
    animation: pillIn .35s cubic-bezier(.34,1.56,.64,1);
  }
  .congrat-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  @keyframes pillIn { from { opacity: 0; transform: translateY(6px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

  .state-msg {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
    font-size: 14px;
  }

  @media (max-width: 780px) {
    .shell { grid-template-columns: 1fr; padding: 26px; margin: 16px; }
    .sidebar { flex-direction: row; flex-wrap: wrap; align-items: center; }
    .avatar { width: 64px; height: 64px; font-size: 20px; }
    nav { flex-direction: row; flex-wrap: wrap; margin-top: 10px; }
    .cards-row, .stats-grid { grid-template-columns: 1fr; }
    .top-row { flex-direction: column; gap: 16px; }
  }
</style>
</head>
<body>

<div class="blob blob-teal"></div>
<div class="blob blob-orange"></div>

<div class="shell">
  <aside class="sidebar">
    <div class="logo-mark"><img src="../images/logo-icon.png" alt="Richard J Winarta logo" /></div>
    <div class="avatar" id="avatarInitials">
      --
      <span class="batch-badge" id="batchBadge">Batch —</span>
    </div>
    <div class="student-name" id="studentName">Memuat...</div>
    <div class="student-id" id="studentIdLabel">—</div>

    <nav>
      <span class="nav-item active">
        <span class="nav-icon nav-icon-purple">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
        </span>
        Dashboard
      </span>
      <a class="nav-item link" href="../directory/index.html">
        <span class="nav-icon nav-icon-teal">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </span>
        Directory
      </a>
      <span class="nav-item disabled">
        <span class="nav-icon nav-icon-orange">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="6" height="6" rx="1"/><path d="M3 17l2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>
        </span>
        Task Tracker
        <span class="soon-tag">Segera</span>
      </span>
      <span class="nav-item disabled">
        <span class="nav-icon nav-icon-gold">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h2a2 2 0 0 1 2 2 4 4 0 0 1-4 4"/><path d="M7 5H5a2 2 0 0 0-2 2 4 4 0 0 0 4 4"/></svg>
        </span>
        Hall of Fame
        <span class="soon-tag">Segera</span>
      </span>
    </nav>

    <button class="logout-mini" onclick="logout()">Logout</button>
  </aside>

  <main>
    <div class="top-row">
      <div class="greeting">
        <h1 id="greetingName">Hello,</h1>
        <div class="sub">Ini ringkasan progres belajar kamu sejauh ini.</div>
      </div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div id="dashboardBody">
      <div class="state-msg">Memuat data kamu...</div>
    </div>
  </main>
</div>

<script src="../shared/auth.js"></script>
<script>
  const MASTER_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRr6-XZsGCIoKV_42xhBzt6lzyA8TiothqCv1BXOr89Pt8hJsT1j5pCToTZicf5uwL13IEkMH47cORX/pub?output=csv";
  const PORTFOLIO_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRr6-XZsGCIoKV_42xhBzt6lzyA8TiothqCv1BXOr89Pt8hJsT1j5pCToTZicf5uwL13IEkMH47cORX/pub?gid=758194686&single=true&output=csv";

  const MASTER_TASK_START_COL = 6;   // kolom index tempat data task dimulai
  const MASTER_TASK_COUNT = 49;      // jumlah task (triplet Score/Status/Alasan)
  const PORTFOLIO_STATUS_COL = 7;    // kolom "Portfolio" di sheet Portfolio Status
  const TOTAL_MAX_SCORE = 5400;      // skor maksimum untuk status "Full Score"

  const ICONS = {
    check: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`,
    clock: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>`,
    target: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8" fill="#fff"/></svg>`,
  };

  function fetchCsvRows(url) {
    return new Promise((resolve, reject) => {
      Papa.parse(url, {
        download: true,
        skipEmptyLines: false,
        complete: (results) => resolve(results.data),
        error: (err) => reject(err),
      });
    });
  }

  function findStudentRow(rows, studentId) {
    // baris 0 = baris kosong, baris 1 = header, data mulai dari baris 2
    for (let i = 2; i < rows.length; i++) {
      const row = rows[i];
      if (row[0] && row[0].toString().trim() === studentId.toString().trim()) {
        return row;
      }
    }
    return null;
  }

  function computeTaskStats(row) {
    let completed = 0;
    let pending = 0;
    let totalScore = 0;

    for (let t = 0; t < MASTER_TASK_COUNT; t++) {
      const idx = MASTER_TASK_START_COL + t * 3;
      const scoreRaw = row[idx];
      const flag = (row[idx + 1] || "").toString().trim().toUpperCase();

      if (flag === "TRUE") {
        completed++;
        const score = parseFloat(scoreRaw);
        if (!isNaN(score)) totalScore += score;
      } else if (flag === "FALSE") {
        pending++;
      }
    }

    const applicable = completed + pending;
    // dibulatkan ke 1 desimal dengan aman (hindari 27.799999999999997)
    const completedPct = applicable > 0 ? Math.round((completed / applicable) * 1000) / 10 : 0;
    const pendingPct = applicable > 0 ? Math.round((pending / applicable) * 1000) / 10 : 0;

    return { completed, pending, completedPct, pendingPct, totalScore };
  }

  function titleCaseService(raw) {
    if (!raw) return "—";
    return raw
      .toLowerCase()
      .split(" ")
      .map((w) => w.charAt(0).toUpperCase() + w.slice(1))
      .join(" ");
  }

  function initials(name) {
    if (!name) return "??";
    return name
      .trim()
      .split(/\s+/)
      .slice(0, 2)
      .map((w) => w[0])
      .join("")
      .toUpperCase();
  }

  function renderPortfolioPill(statusRaw) {
    const status = (statusRaw || "").toString().trim();
    const lower = status.toLowerCase();

    if (lower === "approved") {
      return `<span class="status-pill status-approved">✓ Approved</span>`;
    }
    if (lower === "rejected") {
      return `<span class="status-pill status-rejected">✕ Rejected</span>`;
    }
    if (lower === "pending") {
      return `<span class="status-pill status-pending">● Pending</span>`;
    }
    return `<span class="status-pill status-pending">Belum Direview</span>`;
  }

  function renderCongratPills(completedPct, totalScore) {
    const pills = [];
    if (completedPct >= 100) {
      pills.push(`<span class="congrat-pill"><span class="dot"></span>Congrat 100% Completion</span>`);
    }
    if (totalScore >= TOTAL_MAX_SCORE) {
      pills.push(`<span class="congrat-pill"><span class="dot"></span>Congrat Full Score! 🎉</span>`);
    }
    if (pills.length === 0) return "";
    return `<div class="congrat-row">${pills.join("")}</div>`;
  }

  // Ring lingkaran kecil pakai SVG, radius tetap, offset dihitung dari %
  function ringSvg(pct, idSuffix) {
    const r = 26;
    const circumference = 2 * Math.PI * r;
    const offset = circumference - (pct / 100) * circumference;
    return `
      <div class="ring-wrap">
        <svg width="64" height="64" viewBox="0 0 64 64">
          <circle class="ring-track" cx="32" cy="32" r="${r}" />
          <circle class="ring-fill" cx="32" cy="32" r="${r}"
            stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" />
        </svg>
        <div class="ring-label">${pct}%</div>
      </div>
    `;
  }

  function renderDashboard({ nama, batch, hids, completed, pending, completedPct, pendingPct, totalScore, portfolioStatus }) {
    document.getElementById("avatarInitials").innerHTML = `
      ${initials(nama)}
      <span class="batch-badge">Batch ${batch || "—"}</span>
    `;
    document.getElementById("studentName").textContent = nama;
    document.getElementById("greetingName").textContent = `Hello, ${nama}`;

    document.getElementById("dashboardBody").innerHTML = `
      <section class="cards-row">
        <div class="card card-selesai">
          <div class="card-head">
            <h3>Task Selesai</h3>
            <div class="card-icon">${ICONS.check}</div>
          </div>
          <div class="card-body">
            ${ringSvg(completedPct, "done")}
            <div class="card-stat-text">
              <div class="count">${completed}</div>
              <div class="label">dari ${completed + pending} task</div>
            </div>
          </div>
        </div>

        <div class="card card-belum">
          <div class="card-head">
            <h3>Task yg Belum</h3>
            <div class="card-icon">${ICONS.clock}</div>
          </div>
          <div class="card-body">
            ${ringSvg(pendingPct, "pending")}
            <div class="card-stat-text">
              <div class="count">${pending}</div>
              <div class="label">masih tersisa</div>
            </div>
          </div>
        </div>

        <div class="card card-hids">
          <div class="card-head">
            <h3>HIDS</h3>
            <div class="card-icon">${ICONS.target}</div>
          </div>
          <div class="card-body">
            <span class="hids-tag">Highlight Service</span>
            <div class="hids-value">${hids}</div>
          </div>
        </div>
      </section>

      <h2 class="section-title">Statistics</h2>
      <section class="stats-grid">
        <div class="stat-box">
          <div class="big">${completedPct}%</div>
          <div class="label">% Completion</div>
        </div>
        <div class="stat-box">
          <div class="big">${totalScore.toLocaleString("id-ID")}</div>
          <div class="label">Total Score</div>
        </div>
        <div class="stat-box">
          <div class="big">${renderPortfolioPill(portfolioStatus)}</div>
          <div class="label">Portfolio</div>
        </div>
      </section>

      ${renderCongratPills(completedPct, totalScore)}
    `;
  }

  function renderError(message) {
    document.getElementById("dashboardBody").innerHTML = `
      <div class="state-msg">
        ${message}
        <div style="margin-top:14px">
          <button class="logout-btn" style="background:var(--purple-deep)" onclick="init()">Coba Lagi</button>
        </div>
      </div>`;
  }

  function withTimeout(promise, ms, label) {
    return Promise.race([
      promise,
      new Promise((_, reject) =>
        setTimeout(() => reject(new Error(`${label} timeout setelah ${ms / 1000}s`)), ms)
      ),
    ]);
  }

  async function init() {
    document.getElementById("dashboardBody").innerHTML = `<div class="state-msg">Memuat data kamu...</div>`;

    // Mulai checkLogin() DAN fetch CSV secara BERSAMAAN (bukan berurutan),
    // supaya total waktu tunggu = proses paling lambat, bukan jumlah semuanya.
    const sessionPromise = withTimeout(checkLogin(), 15000, "Verifikasi login");
    const csvPromise = withTimeout(
      Promise.all([fetchCsvRows(MASTER_CSV_URL), fetchCsvRows(PORTFOLIO_CSV_URL)]),
      15000,
      "Ambil data Sheet"
    );

    let session;
    try {
      session = await sessionPromise;
    } catch (err) {
      console.error(err);
      renderError("Gagal verifikasi login (server mungkin lambat merespons). Coba lagi ya.");
      return;
    }
    if (!session) return; // checkLogin sudah handle redirect kalau memang tidak valid

    document.getElementById("studentIdLabel").textContent = session.studentId;

    try {
      const [masterRows, portfolioRows] = await csvPromise;

      const masterRow = findStudentRow(masterRows, session.studentId);
      if (!masterRow) {
        renderError("Data kamu tidak ditemukan di Master Students. Hubungi admin ya.");
        return;
      }

      const hidsRaw = masterRow[4]; // kolom "Chosen Highlight Service"
      const { completed, pending, completedPct, pendingPct, totalScore } = computeTaskStats(masterRow);

      const portfolioRow = findStudentRow(portfolioRows, session.studentId);
      const portfolioStatus = portfolioRow ? portfolioRow[PORTFOLIO_STATUS_COL] : "";

      renderDashboard({
        nama: session.nama || masterRow[1],
        batch: session.batch,
        hids: titleCaseService(hidsRaw),
        completed,
        pending,
        completedPct,
        pendingPct,
        totalScore,
        portfolioStatus,
      });
    } catch (err) {
      console.error(err);
      renderError("Gagal memuat data Sheet (server mungkin lambat merespons). Coba lagi ya.");
    }
  }

  init();
</script>
